<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYSHHB Portal System</title>
<meta name="theme-color" content="#1f8a3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SYSHHB Portal">
<style>
:root{--green:#1f8a3b;--green-d:#146b2c;--yellow:#f6e62a;--bg:#f4f8f2;--card:#fff;--text:#1c2a1f;--muted:#5d6f61;--line:#dfe8dc;--shadow:0 4px 14px rgba(20,80,40,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a12;--card:#17251a;--text:#eaf3ea;--muted:#9db3a1;--line:#27402c;--shadow:0 4px 14px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f1a12;--card:#17251a;--text:#eaf3ea;--muted:#9db3a1;--line:#27402c;--shadow:0 4px 14px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* header: fixed, compact, always visible */
.hero{flex:none;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--green),var(--green-d));color:#fff;
  padding:clamp(8px,1.6vh,16px) 12px clamp(10px,2vh,18px);text-align:center;border-radius:0 0 26px 26px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bar{position:absolute;z-index:3;top:8px;right:10px;display:flex;gap:6px}
.chip{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;height:34px;min-width:38px;transition:.2s}
.chip:hover{background:rgba(255,255,255,.3)}.chip:active{transform:scale(.94)}
.logo{position:relative;z-index:2;width:clamp(58px,10vh,92px);height:clamp(58px,10vh,92px);margin:0 auto clamp(4px,.8vh,8px);border-radius:50%;background:#fff;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.logo img{width:100%;height:100%;display:block;border-radius:50%}
h1{position:relative;z-index:2;margin:0;font-size:clamp(18px,3.4vh,28px);letter-spacing:.3px;line-height:1.15}
.sub{position:relative;z-index:2;margin:2px 0 clamp(6px,1.2vh,12px);opacity:.92;font-size:clamp(11px,1.7vh,14px)}

/* clock */
.clockcard{position:relative;z-index:2;max-width:520px;margin:0 auto;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:clamp(6px,1.2vh,12px) 10px}
.greet{font-size:clamp(11px,1.6vh,13px);opacity:.95;margin-bottom:clamp(2px,.6vh,6px)}
.timerow{display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;user-select:none}
.ring{position:relative;width:clamp(46px,8vh,72px);aspect-ratio:1;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.2)}.ring .fg{stroke:var(--yellow)}
.ring .sun{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(20px,3.6vh,30px)}
.digits{display:flex;align-items:center;gap:3px}
.dg{width:clamp(22px,7vw,34px);height:clamp(34px,6.2vh,50px);display:grid;place-items:center;border-radius:8px;font-size:clamp(22px,4.2vh,36px);font-weight:800;
  font-variant-numeric:tabular-nums;background:linear-gradient(#fff 0 50%,#eef5ec 50%);color:var(--green-d);box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative;overflow:hidden}
.dg::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.18)}
.dg.flip{animation:flip .4s ease}
@keyframes flip{0%{transform:rotateX(-90deg);opacity:.2}100%{transform:none;opacity:1}}
.colon{font-size:clamp(18px,3.4vh,28px);font-weight:800;animation:blink 1s steps(2,start) infinite;color:var(--yellow)}
@keyframes blink{50%{opacity:.15}}
.ampm{font-size:11px;font-weight:700;background:var(--yellow);color:var(--green-d);border-radius:7px;padding:2px 6px;margin-left:3px;align-self:flex-start;margin-top:2px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:clamp(5px,1vh,10px)}
.dbox{background:rgba(255,255,255,.14);border-radius:12px;padding:clamp(4px,.9vh,8px) 6px;cursor:pointer;transition:.2s;text-align:center}
.dbox:hover{background:rgba(255,255,255,.26)}.dbox:active{transform:scale(.97)}
.dbox small{display:block;opacity:.8;font-size:10px;text-transform:uppercase;letter-spacing:.6px}
.dbox b{font-size:clamp(12px,3.3vw,15px);line-height:1.2;display:block}
.hint{font-size:10.5px;opacity:.75;margin-top:clamp(3px,.8vh,7px)}

/* calendar popup (overlay, so page never scrolls) */
.calwrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px}
.calwrap.open{display:flex}
.cal{width:100%;max-width:380px;max-height:92dvh;overflow:auto;background:var(--card);color:var(--text);border-radius:20px;padding:12px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:in .25s}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.calhead button{border:0;background:#e6f6e9;color:var(--green-d);width:38px;height:38px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;flex:none}
.calhead button:active{transform:scale(.9)}
.calhead div{flex:1;font-weight:700;font-size:15px;line-height:1.2}.calhead div small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cg .w{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}.cg .w.fri{color:#c0392b}
.cd{border-radius:10px;padding:4px 0;font-size:14px;font-weight:600;min-height:42px}
.cd i{display:block;font-style:normal;font-size:10px;color:#2e8b4d;font-weight:500}
.cd.fri{color:#c0392b}
.cd.today{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff}.cd.today i{color:#fdf9c4}
.cd.h1st i{font-weight:800;color:#b8860b}.cd.today.h1st i{color:#fdf9c4}
.adj{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.adj button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer}
.closecal{margin-top:10px;border:0;background:var(--green);color:#fff;border-radius:12px;padding:10px 22px;font-weight:700;font-size:14px;cursor:pointer}

/* systems: fill the rest of the screen */
main{flex:1;min-height:0;overflow:auto;padding:clamp(10px,1.8vh,16px) 12px clamp(10px,1.8vh,16px);display:flex;flex-direction:column;justify-content:center}
.grid{width:100%;max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(8px,1.5vh,14px)}
.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:clamp(8px,1.5vh,14px) 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;opacity:0;animation:in .5s forwards;transition:box-shadow .2s,border-color .2s}
.card::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--green),var(--yellow))}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(246,230,42,.25),transparent 55%);opacity:0;transition:.25s}
.card:hover{border-color:var(--green);box-shadow:0 8px 22px rgba(20,100,50,.25)}.card:hover::before{opacity:1}
.card:active{transform:scale(.98)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.ico{width:clamp(40px,6.6vh,54px);height:clamp(40px,6.6vh,54px);border-radius:15px;display:grid;place-items:center;font-size:clamp(22px,3.8vh,30px);background:linear-gradient(135deg,#e6f6e9,#fdf9c4);box-shadow:0 3px 8px rgba(31,138,59,.18)}
.card:hover .ico{animation:wiggle .6s}
@keyframes wiggle{25%{transform:rotate(-14deg) scale(1.15)}50%{transform:rotate(12deg) scale(1.15)}75%{transform:rotate(-8deg) scale(1.1)}}
.txt{min-width:0}
.card h2{margin:0;font-size:clamp(14px,2.2vh,17px);line-height:1.25}
.card p{margin:2px 0 0;color:var(--muted);font-size:clamp(11.5px,1.7vh,13.5px);line-height:1.35}
.go{color:var(--green);font-weight:800;font-size:20px;transition:transform .2s}.card:hover .go{transform:translateX(5px)}
:root[data-theme="dark"] .go{color:#7fe08f}
.rip{position:absolute;border-radius:50%;background:rgba(31,138,59,.3);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.foot{flex:none;text-align:center;font-size:12px;color:var(--muted)}
.foot:not(:empty){padding:0 12px 8px}
.btn{border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700;padding:8px 16px;font-size:14px;cursor:pointer;min-height:38px}
.btn.ghost{background:transparent;color:var(--muted);padding:8px}
.install{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;max-width:520px;margin:auto;background:var(--card);border:1px solid var(--green);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);align-items:center;gap:12px}
.install.show{display:flex}.install img{width:42px;height:42px;border-radius:10px}.install div{flex:1;font-size:14px;line-height:1.3}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1}}
</style>
</head>
<body>
<header class="hero">
  <canvas id="fx"></canvas>
  <div class="bar">
    <button class="chip" id="theme" aria-label="Theme">🌓</button>
    <button class="chip" id="lang" aria-label="Language">EN</button>
  </div>
  <div class="logo"><img src="icons/logo.png" alt="Logo Yayasan Sultan Haji Hassanal Bolkiah"></div>
  <h1 data-i18n="title">Sistem Portal SYSHHB</h1>
  <p class="sub">Yayasan Sultan Haji Hassanal Bolkiah</p>

  <div class="clockcard">
    <div class="greet" id="greet"></div>
    <div class="timerow" id="timerow">
      <div class="ring">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="fg" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46"/></svg>
        <div class="sun" id="sun">☀️</div>
      </div>
      <div class="digits">
        <div class="dg" id="d0">0</div><div class="dg" id="d1">0</div><span class="colon">:</span>
        <div class="dg" id="d2">0</div><div class="dg" id="d3">0</div><span class="colon">:</span>
        <div class="dg" id="d4">0</div><div class="dg" id="d5">0</div>
        <span class="ampm" id="ampm"></span>
      </div>
    </div>
    <div class="dates">
      <div class="dbox" id="gbox"><small data-i18n="greg">Masihi</small><b id="gdate"></b></div>
      <div class="dbox" id="hbox"><small data-i18n="hijri">Hijrah</small><b id="hdate"></b></div>
    </div>
    <div class="hint" data-i18n="hint"></div>
  </div>
</header>

<main>
  <section class="grid" id="grid"></section>
</main>

<div class="foot" id="foot">
  <button class="btn ghost" id="installLink" style="display:none" data-i18n="installBtn">📲 Pasang Aplikasi</button>
  <span id="iosTip" style="display:none" data-i18n="ios"></span>
</div>

<div class="calwrap" id="calwrap">
  <div class="cal" id="cal">
    <div class="calhead"><button id="prev" aria-label="Prev">‹</button><div id="calt"></div><button id="next" aria-label="Next">›</button></div>
    <div class="cg" id="cg"></div>
    <div class="adj"><span data-i18n="adj">Laras Hijrah (hari):</span><button id="hm">−</button><b id="hoff">0</b><button id="hp">+</button></div>
    <button class="closecal" id="closecal" data-i18n="close">Tutup</button>
  </div>
</div>

<div class="install" id="install" role="dialog">
  <img src="icons/icon-192.png" alt="">
  <div><strong data-i18n="installTitle">Pasang SYSHHB Portal</strong><br><span data-i18n="installText" style="color:var(--muted)">Akses pantas dari skrin utama.</span></div>
  <button class="btn" id="installGo" data-i18n="install">Pasang</button>
  <button class="btn ghost" id="installX" aria-label="Tutup">✕</button>
</div>

<script>
/* ===== TAMBAH / UBAH SISTEM DI SINI (add or edit systems here) ===== */
const SYSTEMS = [
  { icon:"🛠️", url:"https://helpdesk.syayasan.edu.bn/",
    ms:{name:"SYSHHB IT Helpdesk", desc:"Hantar dan jejak aduan serta permintaan sokongan IT."},
    en:{name:"SYSHHB IT Helpdesk", desc:"Submit and track IT complaints and support requests."} },
  { icon:"🧾", url:"https://pembelian.syayasan.edu.bn/",
    ms:{name:"SYSHHB IT Purchase Tracker", desc:"Jejak proses pembelian aset: 601, 602, T-607, Indent, DO dan Invois."},
    en:{name:"SYSHHB IT Purchase Tracker", desc:"Track asset purchases: 601, 602, T-607, Indent, DO and Invoice."} },
  { icon:"💻", url:"https://itinventory.syayasan.edu.bn/",
    ms:{name:"SYSHHB IT Asset Inventory", desc:"Senarai dan pengurusan inventori aset IT."},
    en:{name:"SYSHHB IT Asset Inventory", desc:"IT asset inventory list and management."} }
];
const HM = ["Muharram","Safar","Rabiulawal","Rabiulakhir","Jamadilawal","Jamadilakhir","Rejab","Syaaban","Ramadan","Syawal","Zulkaedah","Zulhijjah"];
const T = {
 ms:{title:"Sistem Portal SYSHHB",greg:"Masihi",hijri:"Hijrah",adj:"Laras Hijrah (hari):",close:"Tutup",
   hint:"Ketik jam: 12/24 jam · Ketik tarikh: kalendar · GMT+8",installBtn:"📲 Pasang Aplikasi",installTitle:"Pasang SYSHHB Portal",installText:"Akses pantas dari skrin utama.",install:"Pasang",
   ios:"iPhone/iPad: ketik Kongsi ⬆️ kemudian “Tambah ke Skrin Utama”.",other:"EN",pm:"PTG",am:"PG",
   days:["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"],dshort:["Ahd","Isn","Sel","Rab","Kha","Jum","Sab"],
   months:["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"],
   g:["Selamat pagi","Selamat tengah hari","Selamat petang","Selamat malam"]},
 en:{title:"SYSHHB Portal System",greg:"Gregorian",hijri:"Hijri",adj:"Hijri adjust (days):",close:"Close",
   hint:"Tap clock: 12/24h · Tap date: calendar · GMT+8",installBtn:"📲 Install App",installTitle:"Install SYSHHB Portal",installText:"Quick access from your home screen.",install:"Install",
   ios:"iPhone/iPad: tap Share ⬆️ then “Add to Home Screen”.",other:"BM",pm:"PM",am:"AM",
   days:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],dshort:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
   months:["January","February","March","April","May","June","July","August","September","October","November","December"],
   g:["Good morning","Good afternoon","Good evening","Good night"]}
};
const $ = s => document.querySelector(s);
const store = {get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let lang = store.get('lang','ms'), h24 = store.get('h24','1')==='1', hoff = parseInt(store.get('hoff','0'))||0;
let view = null;

const TZ='Asia/Brunei';
const bnFmt = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'});
function bnNow(){const o={};bnFmt.formatToParts(new Date()).forEach(p=>o[p.type]=+p.value);return {y:o.year,m:o.month,d:o.day,h:o.hour,i:o.minute,s:o.second};}
const hFmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:TZ,day:'numeric',month:'numeric',year:'numeric'});
function hijri(y,m,d){const dt=new Date(Date.UTC(y,m-1,d+hoff,4));const o={};hFmt.formatToParts(dt).forEach(p=>o[p.type]=parseInt(p.value));return {d:o.day,m:o.month,y:o.year||o.relatedYear};}
const dow=(y,m,d)=>new Date(Date.UTC(y,m-1,d)).getUTCDay();

const dEls=[0,1,2,3,4,5].map(i=>$('#d'+i)); let last=['','','','','',''];
function setDigits(str){str.split('').forEach((c,i)=>{if(last[i]!==c){dEls[i].textContent=c;dEls[i].classList.remove('flip');void dEls[i].offsetWidth;dEls[i].classList.add('flip');last[i]=c;}});}
let lastSec=-1;
function updateClock(){
  const n=bnNow(),t=T[lang];
  if(n.s!==lastSec){
    lastSec=n.s;
    let h=n.h; if(!h24){h=h%12||12;}
    setDigits(String(h).padStart(2,'0')+String(n.i).padStart(2,'0')+String(n.s).padStart(2,'0'));
    $('#ampm').textContent=h24?'':(n.h>=12?t.pm:t.am);
    $('#ampm').style.display=h24?'none':'';
    $('#sun').textContent=n.h>=6&&n.h<18?(n.h>=17?'🌇':'☀️'):'🌙';
    const gi=n.h<5?3:n.h<12?0:n.h<15?1:n.h<19?2:3;
    $('#greet').textContent=t.g[gi]+' 👋';
    if(n.s===0||!$('#gdate').textContent) updateDates(n);
  }
  requestAnimationFrame(updateClock);
}
function updateDates(n){
  n=n||bnNow();const t=T[lang],hj=hijri(n.y,n.m,n.d);
  $('#gdate').textContent=t.days[dow(n.y,n.m,n.d)]+', '+n.d+' '+t.months[n.m-1]+' '+n.y;
  $('#hdate').textContent=hj.d+' '+HM[hj.m-1]+' '+hj.y+' H';
}
(function ring(){const ms=(Date.now()%60000)/60000;$('#fg').style.strokeDashoffset=276.46*(1-ms);requestAnimationFrame(ring);})();

function drawCal(){
  const t=T[lang],n=bnNow(); if(!view) view={y:n.y,m:n.m};
  const first=dow(view.y,view.m,1),dim=new Date(Date.UTC(view.y,view.m,0)).getUTCDate();
  const h1=hijri(view.y,view.m,1),h2=hijri(view.y,view.m,dim);
  $('#calt').innerHTML=t.months[view.m-1]+' '+view.y+'<small>'+HM[h1.m-1]+' '+h1.y+(h1.m!==h2.m?' – '+HM[h2.m-1]+' '+h2.y:'')+' H</small>';
  let html=t.dshort.map((d,i)=>`<div class="w${i===5?' fri':''}">${d}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=dim;d++){
    const hj=hijri(view.y,view.m,d),dw=dow(view.y,view.m,d);
    const cls=['cd',dw===5?'fri':'',(view.y===n.y&&view.m===n.m&&d===n.d)?'today':'',hj.d===1?'h1st':''].join(' ');
    html+=`<div class="${cls}">${d}<i>${hj.d===1?HM[hj.m-1].slice(0,3)+' 1':hj.d}</i></div>`;
  }
  $('#cg').innerHTML=html; $('#hoff').textContent=(hoff>0?'+':'')+hoff;
}
const openCal=()=>{view=null;drawCal();$('#calwrap').classList.add('open');};
const closeCal=()=>$('#calwrap').classList.remove('open');
$('#hbox').onclick=$('#gbox').onclick=openCal;
$('#closecal').onclick=closeCal;
$('#calwrap').addEventListener('click',e=>{if(e.target.id==='calwrap')closeCal();});
$('#prev').onclick=()=>{view.m--;if(view.m<1){view.m=12;view.y--;}drawCal();};
$('#next').onclick=()=>{view.m++;if(view.m>12){view.m=1;view.y++;}drawCal();};
$('#hm').onclick=()=>{hoff--;store.set('hoff',hoff);updateDates();drawCal();};
$('#hp').onclick=()=>{hoff++;store.set('hoff',hoff);updateDates();drawCal();};
$('#timerow').onclick=()=>{h24=!h24;store.set('h24',h24?'1':'0');lastSec=-1;last=['','','','','',''];};

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;document.title=t.title;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
  $('#lang').textContent=t.other;
  $('#grid').innerHTML=SYSTEMS.map((s,i)=>`<a class="card" href="${s.url}" target="_blank" rel="noopener" style="animation-delay:${i*90}ms">
    <div class="ico">${s.icon}</div><div class="txt"><h2>${s[lang].name}</h2><p>${s[lang].desc}</p></div><span class="go">→</span></a>`).join('');
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)/r.width*100+'%');c.style.setProperty('--my',(e.clientY-r.top)/r.height*100+'%');});
    c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),s=document.createElement('span');s.className='rip';const z=Math.max(r.width,r.height)/4;
      s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;c.appendChild(s);setTimeout(()=>s.remove(),600);});
  });
  lastSec=-1;updateDates();if($('#calwrap').classList.contains('open'))drawCal();
}
$('#lang').onclick=()=>{lang=lang==='ms'?'en':'ms';store.set('lang',lang);render();};
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;store.set('theme',nx);};
const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th;

/* soft sparkles in header (decorative) */
(function(){const cv=$('#fx'),cx=cv.getContext('2d');let W,H,P=[];
  function size(){W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;P=Array.from({length:Math.round(W/40)},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,v:.15+Math.random()*.4,a:Math.random()*6}));}
  size();addEventListener('resize',size);
  function f(){cx.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v;p.a+=.03;if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
    cx.beginPath();cx.fillStyle=`rgba(246,230,42,${.2+.2*Math.sin(p.a)})`;cx.arc(p.x,p.y,p.r,0,7);cx.fill();});requestAnimationFrame(f);}
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)f();})();

let deferred=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#installLink').style.display='inline-block';
  let dis=null;try{dis=sessionStorage.getItem('dismissInstall')}catch(_){}if(!dis)$('#install').classList.add('show');});
async function doInstall(){if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#install').classList.remove('show');$('#installLink').style.display='none';}
$('#installGo').onclick=doInstall;$('#installLink').onclick=doInstall;
$('#installX').onclick=()=>{$('#install').classList.remove('show');try{sessionStorage.setItem('dismissInstall','1')}catch(_){}};
addEventListener('appinstalled',()=>$('#install').classList.remove('show'));
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone)$('#iosTip').style.display='inline';
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

render();updateClock();
</script>
</body>
</html>

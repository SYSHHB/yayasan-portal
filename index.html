<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{background:#27a047}</style>
<title>SYSHHB IT Portal</title>
<meta name="theme-color" content="#27a047">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SYSHHB IT Portal">
<style>
:root{
  --pine:#0d3b26;--green:#27a047;--green-d:#157a35;--sun:#f8f038;--gold:#a8946a;
  --bg:#eef4ee;--card:#ffffff;--text:#10241a;--muted:#5f7466;--line:rgba(16,36,26,.08);
  --shadow:0 1px 2px rgba(16,36,26,.06),0 10px 28px -10px rgba(16,60,30,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09130d;--card:#14231a;--text:#eaf4ec;--muted:#93aa9a;--line:rgba(255,255,255,.08);--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -12px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#09130d;--card:#14231a;--text:#eaf4ec;--muted:#93aa9a;--line:rgba(255,255,255,.08);--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -12px rgba(0,0,0,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit}

/* ---------- header ---------- */
.hero{flex:none;position:relative;color:#fff;border-radius:0 0 34px 34px;
  padding:clamp(10px,2vh,18px) 16px clamp(14px,2.6vh,22px);
  background:
    radial-gradient(120% 70% at 100% 0%,rgba(248,240,56,.28),transparent 55%),
    radial-gradient(90% 60% at 0% 100%,rgba(255,255,255,.14),transparent 60%),
    linear-gradient(180deg,#27a047 0%,#1b8a3c 55%,#0f6b30 100%);
  box-shadow:0 14px 30px -14px rgba(10,70,30,.65)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:clamp(19px,3.3vh,26px);font-weight:800;letter-spacing:-.4px;line-height:1.1}
.sub{margin:3px 0 0;font-size:clamp(11px,1.6vh,13px);opacity:.82;font-weight:500}
.tools{display:flex;gap:6px;flex:none}
.pill{border:0;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;height:36px;min-width:40px;padding:0 12px;font-weight:700;font-size:13px;cursor:pointer;backdrop-filter:blur(8px);transition:background .2s,transform .15s}
.pill:hover{background:rgba(255,255,255,.28)}.pill:active{transform:scale(.94)}
.pill:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.glass{margin-top:clamp(10px,2vh,18px);display:flex;align-items:center;gap:clamp(12px,3.5vw,20px);
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);border-radius:26px;padding:clamp(10px,1.8vh,16px);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.crest{position:relative;flex:none;width:clamp(74px,12.5vh,104px);aspect-ratio:1}
.crest img{position:absolute;inset:9%;width:82%;height:82%;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.crest svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.crest circle{fill:none;stroke-width:4;stroke-linecap:round}
.crest .bg{stroke:rgba(255,255,255,.22)}.crest .fg{stroke:var(--sun)}
.time{flex:1;min-width:0;cursor:pointer;user-select:none}
.greet{font-size:clamp(12px,1.8vh,14px);font-weight:600;opacity:.9}
.clock{display:flex;align-items:baseline;gap:6px;line-height:1;margin-top:2px}
.hm{font-size:clamp(40px,7.6vh,62px);font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.sec{font-size:clamp(20px,3.8vh,30px);font-weight:700;color:var(--sun);font-variant-numeric:tabular-nums}
.ampm{font-size:12px;font-weight:800;color:#0d3b26;background:var(--sun);border-radius:8px;padding:2px 6px;align-self:center}
.fmt{margin-top:6px;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:4px 10px;cursor:pointer}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:clamp(8px,1.5vh,12px)}
.chip{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.13);color:#fff;border-radius:18px;padding:clamp(7px,1.2vh,10px) 10px;cursor:pointer;transition:background .2s,transform .15s;min-width:0}
.chip:hover{background:rgba(255,255,255,.24)}.chip:active{transform:scale(.97)}
.chip .ic{flex:none;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:15px}
.chip span{display:block;min-width:0}
.chip small{display:block;font-size:10.5px;opacity:.78;font-weight:600}
.chip b{display:block;font-size:clamp(11.5px,3.1vw,14px);font-weight:700;line-height:1.2}

/* ---------- tiles ---------- */
main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;padding:clamp(12px,2vh,20px) 16px}
.grid{width:100%;max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.8vh,16px)}
@media(min-width:720px){.grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,10px);text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:26px;padding:clamp(12px,2vh,18px);box-shadow:var(--shadow);overflow:hidden;transition:transform .18s,box-shadow .2s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:scale(.97)}
.tile .ico{width:clamp(42px,6.4vh,54px);aspect-ratio:1;border-radius:17px;display:grid;place-items:center;font-size:clamp(22px,3.6vh,29px);
  background:linear-gradient(145deg,var(--t1),var(--t2));box-shadow:0 8px 16px -8px var(--t2),inset 0 1px 0 rgba(255,255,255,.7)}
.tile h2{margin:2px 0 0;font-size:clamp(13.5px,2.1vh,16px);font-weight:750;letter-spacing:-.2px;line-height:1.2}
.tile p{margin:0;color:var(--muted);font-size:clamp(11px,1.6vh,12.5px);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .go{position:absolute;top:clamp(12px,2vh,16px);right:clamp(12px,2vh,16px);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--bg);color:var(--green-d);font-size:15px;font-weight:800;transition:background .2s,color .2s,transform .2s}
:root[data-theme="dark"] .tile .go{color:#7fe08f}
.tile:hover .go{background:var(--green);color:#fff;transform:rotate(-45deg)}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ---------- calendar sheet ---------- */
.calwrap{position:fixed;inset:0;z-index:30;background:rgba(5,25,12,.55);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.calwrap.open{display:flex}
.cal{width:100%;max-width:420px;max-height:94dvh;overflow:auto;background:var(--card);color:var(--text);border-radius:30px 30px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));text-align:center;animation:sheet .3s cubic-bezier(.2,.8,.2,1)}
@media(min-width:520px){.calwrap{align-items:center}.cal{border-radius:28px}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.calhead button{border:0;background:var(--bg);color:var(--green-d);width:40px;height:40px;border-radius:14px;font-size:20px;font-weight:700;cursor:pointer;flex:none}
:root[data-theme="dark"] .calhead button{color:#7fe08f}
.calhead div{flex:1;font-weight:800;font-size:16px;line-height:1.2}.calhead div small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cg .w{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}.cg .w.fri{color:#d0453a}
.cd{border-radius:12px;padding:4px 0;font-size:14px;font-weight:700;min-height:42px}
.cd i{display:block;font-style:normal;font-size:10px;color:var(--green-d);font-weight:600}
:root[data-theme="dark"] .cd i{color:#7fe08f}
.cd.fri{color:#d0453a}
.cd.today{background:linear-gradient(160deg,var(--green),var(--green-d));color:#fff;box-shadow:0 6px 12px -6px var(--green)}.cd.today i{color:#fdf9c4}
.cd.h1st i{font-weight:800;color:#a8780a}.cd.today.h1st i{color:#fdf9c4}
.adj{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.adj button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:10px;width:32px;height:32px;font-size:16px;cursor:pointer}
.closecal{margin-top:12px;width:100%;border:0;background:var(--green);color:#fff;border-radius:16px;padding:13px;font-weight:800;font-size:15px;cursor:pointer}

.foot{flex:none;text-align:center;font-size:12px;color:var(--muted)}.foot:not(:empty){padding:0 12px 8px}
.btn{border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:700;padding:9px 16px;font-size:14px;cursor:pointer;min-height:40px}
.btn.ghost{background:transparent;color:var(--muted);padding:8px}
.install{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;max-width:520px;margin:auto;background:var(--card);border:1px solid var(--green);border-radius:22px;padding:12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.3);align-items:center;gap:12px}
.install.show{display:flex}.install img{width:42px;height:42px;border-radius:12px}.install div{flex:1;font-size:14px;line-height:1.3}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- desktop / wide screens: centred layout ---------- */
.hero>*{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
@media(min-width:720px){
  .hero{padding-top:22px;padding-bottom:28px}
  .top{position:relative;justify-content:center;text-align:center}
  .tools{position:absolute;right:0;top:0}
  h1{font-size:30px}.sub{font-size:14px}
  .glass{justify-content:center;gap:28px;padding:20px 26px}
  .time{flex:none}
  .crest{width:112px}
  .hm{font-size:68px}.sec{font-size:32px}
  .dates{max-width:560px}
  .chip{justify-content:center;text-align:left;padding:10px 14px}
  .chip b{font-size:15px}
  main{padding:24px 24px 32px}
}
@media(min-width:900px){
  .grid{max-width:1040px;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  .tile{padding:24px;gap:12px}
  .tile .ico{width:62px;font-size:32px;border-radius:20px}
  .tile h2{font-size:18px;margin-top:6px}
  .tile p{font-size:14px;-webkit-line-clamp:3}
  .tile .go{top:20px;right:20px}
}
</style>
</head>

let view = null;

const TZ='Asia/Brunei';
const bnFmt = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'});
function bnNow(){const o={};bnFmt.formatToParts(new Date()).forEach(p=>o[p.type]=+p.value);return {y:o.year,m:o.month,d:o.day,h:o.hour,i:o.minute,s:o.second};}
const hFmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:TZ,day:'numeric',month:'numeric',year:'numeric'});
function hijri(y,m,d){const dt=new Date(Date.UTC(y,m-1,d+hoff,4));const o={};hFmt.formatToParts(dt).forEach(p=>o[p.type]=parseInt(p.value));return {d:o.day,m:o.month,y:o.year||o.relatedYear};}
const dow=(y,m,d)=>new Date(Date.UTC(y,m-1,d)).getUTCDay();
const p2=n=>String(n).padStart(2,'0');

let lastSec=-1;
function updateClock(){
  const n=bnNow(),t=T[lang];
  if(n.s!==lastSec){
    lastSec=n.s;
    let h=n.h; if(!h24){h=h%12||12;}
    $('#hm').textContent=p2(h)+':'+p2(n.i);
    $('#sec').textContent=':'+p2(n.s);
    $('#ampm').textContent=h24?'':(n.h>=12?t.pm:t.am);
    $('#ampm').style.display=h24?'none':'';
    $('#fmt').textContent=h24?'24H':'12H';
    const gi=n.h<5?3:n.h<12?0:n.h<15?1:n.h<19?2:3;
    $('#greet').textContent=t.g[gi];
    if(n.s===0||!$('#gdate').textContent) updateDates(n);
  }
  requestAnimationFrame(updateClock);
}
function updateDates(n){
  n=n||bnNow();const t=T[lang],hj=hijri(n.y,n.m,n.d);
  $('#gdate').textContent=t.days[dow(n.y,n.m,n.d)].slice(0,lang==='ms'?9:3)+', '+n.d+' '+t.months[n.m-1].slice(0,3)+' '+n.y;
  $('#hdate').textContent=hj.d+' '+HM[hj.m-1]+' '+hj.y+' H';
}
(function ring(){const ms=(Date.now()%60000)/60000;$('#fg').style.strokeDashoffset=295.31*(1-ms);requestAnimationFrame(ring);})();

function drawCal(){
  const t=T[lang],n=bnNow(); if(!view) view={y:n.y,m:n.m};
  const first=dow(view.y,view.m,1),dim=new Date(Date.UTC(view.y,view.m,0)).getUTCDate();
  const h1=hijri(view.y,view.m,1),h2=hijri(view.y,view.m,dim);
  $('#calt').innerHTML=t.months[view.m-1]+' '+view.y+'<small>'+HM[h1.m-1]+' '+h1.y+(h1.m!==h2.m?' – '+HM[h2.m-1]+' '+h2.y:'')+' H</small>';
  let html=t.dshort.map((d,i)=>`<div class="w${i===5?' fri':''}">${d}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=dim;d++){
    const hj=hijri(view.y,view.m,d),dw=dow(view.y,view.m,d);
    const cls=['cd',dw===5?'fri':'',(view.y===n.y&&view.m===n.m&&d===n.d)?'today':'',hj.d===1?'h1st':''].join(' ');
    html+=`<div class="${cls}">${d}<i>${hj.d===1?HM[hj.m-1].slice(0,3)+' 1':hj.d}</i></div>`;
  }
  $('#cg').innerHTML=html; $('#hoff').textContent=(hoff>0?'+':'')+hoff;
}
const openCal=()=>{view=null;drawCal();$('#calwrap').classList.add('open');};
const closeCal=()=>$('#calwrap').classList.remove('open');
$('#hbox').onclick=$('#gbox').onclick=openCal;
$('#closecal').onclick=closeCal;
$('#calwrap').addEventListener('click',e=>{if(e.target.id==='calwrap')closeCal();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeCal();});
$('#prev').onclick=()=>{view.m--;if(view.m<1){view.m=12;view.y--;}drawCal();};
$('#next').onclick=()=>{view.m++;if(view.m>12){view.m=1;view.y++;}drawCal();};
$('#hm_').onclick=()=>{hoff--;store.set('hoff',hoff);updateDates();drawCal();};
$('#hp').onclick=()=>{hoff++;store.set('hoff',hoff);updateDates();drawCal();};
$('#timerow').onclick=()=>{h24=!h24;store.set('h24',h24?'1':'0');lastSec=-1;};

let first=true;
function render(){
  const t=T[lang];
  document.documentElement.lang=lang;document.title=t.title;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
  $('#lang').textContent=t.other;
  $('#grid').innerHTML=SYSTEMS.map((s,i)=>`<a class="tile${first?' rise':''}" href="${s.url}" target="_blank" rel="noopener" style="--t1:${s.t[0]};--t2:${s.t[1]};animation-delay:${i*70}ms">
    <div class="ico">${s.icon}</div><h2>${s[lang].name}</h2><p>${s[lang].desc}</p><span class="go">↗</span></a>`).join('');
  first=false;
  lastSec=-1;updateDates();if($('#calwrap').classList.contains('open'))drawCal();
}
$('#lang').onclick=()=>{lang=lang==='ms'?'en':'ms';store.set('lang',lang);render();};
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;store.set('theme',nx);};
const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th;

let deferred=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#installLink').style.display='inline-block';
  let dis=null;try{dis=sessionStorage.getItem('dismissInstall')}catch(_){}if(!dis)$('#install').classList.add('show');});
async function doInstall(){if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#install').classList.remove('show');$('#installLink').style.display='none';}
$('#installGo').onclick=doInstall;$('#installLink').onclick=doInstall;
$('#installX').onclick=()=>{$('#install').classList.remove('show');try{sessionStorage.setItem('dismissInstall','1')}catch(_){}};
addEventListener('appinstalled',()=>$('#install').classList.remove('show'));
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone)$('#iosTip').style.display='inline';
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

render();updateClock();
</script>
</body>
</html>

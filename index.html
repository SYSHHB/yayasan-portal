<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYSHHB Portal System</title>
<meta name="theme-color" content="#1f8a3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SYSHHB Portal">
<style>
:root{--green:#1f8a3b;--green-d:#146b2c;--yellow:#f6e62a;--bg:#f4f8f2;--card:#fff;--text:#1c2a1f;--muted:#5d6f61;--line:#dfe8dc;--shadow:0 6px 20px rgba(20,80,40,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a12;--card:#17251a;--text:#eaf3ea;--muted:#9db3a1;--line:#27402c;--shadow:0 6px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f1a12;--card:#17251a;--text:#eaf3ea;--muted:#9db3a1;--line:#27402c;--shadow:0 6px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--green),var(--green-d));color:#fff;padding:18px 16px 80px;text-align:center}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bar{position:relative;z-index:2;display:flex;justify-content:flex-end;gap:8px}
.chip{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px;transition:.2s}
.chip:hover{background:rgba(255,255,255,.3)}.chip:active{transform:scale(.94)}
.logo-wrap{position:relative;z-index:2;width:120px;height:120px;margin:6px auto 8px;perspective:600px;cursor:pointer}
.logo{width:100%;height:100%;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 0 0 rgba(246,230,42,.6),0 8px 24px rgba(0,0,0,.28);
  animation:float 5s ease-in-out infinite,pulse 3s infinite;transition:transform .15s;transform-style:preserve-3d}
.logo img{width:100%;height:100%;display:block;border-radius:50%}
.logo.spin{animation:spin .9s cubic-bezier(.4,1.4,.5,1)}
@keyframes float{50%{margin-top:-6px}}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(246,230,42,0),0 8px 24px rgba(0,0,0,.28)}100%{box-shadow:0 0 0 0 rgba(246,230,42,0),0 8px 24px rgba(0,0,0,.28)}}
@keyframes spin{to{transform:rotateY(360deg)}}
h1{position:relative;z-index:2;margin:6px 0 2px;font-size:clamp(22px,6vw,34px);letter-spacing:.5px}
.sub{position:relative;z-index:2;margin:0 0 14px;opacity:.92;font-size:14px}

/* clock */
.clockcard{position:relative;z-index:2;max-width:560px;margin:0 auto;background:rgba(0,0,0,.22);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:26px;padding:16px 14px 14px}
.greet{font-size:14px;opacity:.95;margin-bottom:8px}
.timerow{display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;user-select:none}
.ring{position:relative;width:clamp(86px,22vw,112px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.2)}.ring .fg{stroke:var(--yellow);filter:drop-shadow(0 0 5px rgba(246,230,42,.8))}
.ring .sun{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(28px,8vw,38px);animation:float2 3s ease-in-out infinite}
@keyframes float2{50%{transform:translateY(-4px) scale(1.08)}}
.digits{display:flex;align-items:center;gap:4px}
.dg{width:clamp(26px,7.4vw,40px);height:clamp(42px,11.5vw,62px);display:grid;place-items:center;border-radius:10px;font-size:clamp(26px,7.5vw,42px);font-weight:800;
  font-variant-numeric:tabular-nums;background:linear-gradient(#fff 0 50%,#eef5ec 50%);color:var(--green-d);box-shadow:0 3px 8px rgba(0,0,0,.3);position:relative;overflow:hidden}
.dg::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.18)}
.dg.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:rotateX(-90deg);opacity:.2}100%{transform:none;opacity:1}}
.colon{font-size:clamp(22px,6vw,32px);font-weight:800;animation:blink 1s steps(2,start) infinite;color:var(--yellow)}
@keyframes blink{50%{opacity:.15}}
.ampm{font-size:12px;font-weight:700;background:var(--yellow);color:var(--green-d);border-radius:8px;padding:3px 7px;margin-left:4px;align-self:flex-start;margin-top:4px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dbox{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 8px;cursor:pointer;transition:.2s;text-align:center}
.dbox:hover{background:rgba(255,255,255,.26)}.dbox:active{transform:scale(.97)}
.dbox small{display:block;opacity:.8;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.dbox b{font-size:clamp(13px,3.6vw,16px)}
.calbtn{margin-top:10px}
.hint{font-size:11px;opacity:.7;margin-top:8px}

/* calendar */
.cal{display:none;margin-top:12px;background:#fff;color:#1c2a1f;border-radius:18px;padding:12px;text-align:center;animation:in .35s}
:root[data-theme="dark"] .cal{background:#17251a;color:#eaf3ea}
.cal.open{display:block}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.calhead button{border:0;background:#e6f6e9;color:var(--green-d);width:38px;height:38px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer}
.calhead button:active{transform:scale(.9)}
.calhead div{flex:1;font-weight:700;font-size:15px;line-height:1.2}.calhead div small{display:block;font-weight:500;color:#5d6f61;font-size:12px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cg .w{font-size:11px;font-weight:700;color:#5d6f61;padding:4px 0}.cg .w.fri{color:#c0392b}
.cd{border-radius:10px;padding:4px 0;font-size:14px;font-weight:600;min-height:44px;cursor:default;position:relative}
.cd i{display:block;font-style:normal;font-size:10px;color:#2e8b4d;font-weight:500}
.cd.fri{color:#c0392b}
.cd.today{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;box-shadow:0 3px 8px rgba(31,138,59,.5)}.cd.today i{color:#fdf9c4}
.cd.h1st i{font-weight:800;color:#b8860b}.cd.today.h1st i{color:#fdf9c4}
.adj{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:12px;color:#5d6f61}
.adj button{border:1px solid #cfe3d3;background:transparent;color:inherit;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer}

main{max-width:980px;margin:-40px auto 0;padding:0 16px 40px;position:relative;z-index:3}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;padding:15px 0;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:0;perspective:900px}
.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;opacity:0;animation:in .5s forwards;
  transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .15s,box-shadow .2s,border-color .2s}
.card::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,var(--green),var(--yellow))}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(246,230,42,.25),transparent 55%);opacity:0;transition:.25s}
.card:hover{border-color:var(--green);box-shadow:0 14px 30px rgba(20,100,50,.25)}.card:hover::before{opacity:1}
.card:active{transform:scale(.97)}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1}}
.ico{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#e6f6e9,#fdf9c4);
  animation:bob 3s ease-in-out infinite;animation-delay:var(--d,0s);box-shadow:0 4px 10px rgba(31,138,59,.18)}
.card:hover .ico{animation:wiggle .6s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes wiggle{25%{transform:rotate(-14deg) scale(1.2)}50%{transform:rotate(12deg) scale(1.2)}75%{transform:rotate(-8deg) scale(1.15)}}
.card h2{margin:0;font-size:17px}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;flex:1}
.go{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:700;font-size:14px;margin-bottom:4px}
.go span{display:inline-block;transition:transform .2s}.card:hover .go span{transform:translateX(6px)}
:root[data-theme="dark"] .go{color:#7fe08f}
.rip{position:absolute;border-radius:50%;background:rgba(31,138,59,.3);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.empty{display:none;text-align:center;color:var(--muted);padding:30px 0}
.foot{text-align:center;padding:0 16px 28px;font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700;padding:10px 16px;font-size:14px;cursor:pointer;min-height:42px}
.btn.ghost{background:transparent;color:var(--muted);padding:10px}
.install{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;max-width:520px;margin:auto;background:var(--card);border:1px solid var(--green);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);align-items:center;gap:12px}
.install.show{display:flex}.install img{width:42px;height:42px;border-radius:10px}.install div{flex:1;font-size:14px;line-height:1.3}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1}}
</style>
</head>
<body>
<header class="hero">
  <canvas id="fx"></canvas>
  <div class="bar">
    <button class="chip" id="theme" aria-label="Theme">🌓</button>
    <button class="chip" id="lang" aria-label="Language">EN</button>
  </div>
  <div class="logo-wrap" id="logoWrap"><div class="logo" id="logo"><img src="icons/logo.png" alt="Logo Yayasan Sultan Haji Hassanal Bolkiah"></div></div>
  <h1 data-i18n="title">Sistem Portal SYSHHB</h1>
  <p class="sub">Yayasan Sultan Haji Hassanal Bolkiah</p>

  <div class="clockcard">
    <div class="greet" id="greet"></div>
    <div class="timerow" id="timerow" title="12/24">
      <div class="ring">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="fg" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46"/></svg>
        <div class="sun" id="sun">☀️</div>
      </div>
      <div class="digits">
        <div class="dg" id="d0">0</div><div class="dg" id="d1">0</div><span class="colon">:</span>
        <div class="dg" id="d2">0</div><div class="dg" id="d3">0</div><span class="colon">:</span>
        <div class="dg" id="d4">0</div><div class="dg" id="d5">0</div>
        <span class="ampm" id="ampm"></span>
      </div>
    </div>
    <div class="dates">
      <div class="dbox" id="gbox"><small data-i18n="greg">Masihi</small><b id="gdate"></b></div>
      <div class="dbox" id="hbox"><small data-i18n="hijri">Hijrah</small><b id="hdate"></b></div>
    </div>
    <button class="chip calbtn" id="calbtn" data-i18n="calbtn">📅 Kalendar Hijrah</button>
    <div class="cal" id="cal">
      <div class="calhead"><button id="prev" aria-label="Prev">‹</button><div id="calt"></div><button id="next" aria-label="Next">›</button></div>
      <div class="cg" id="cg"></div>
      <div class="adj"><span data-i18n="adj">Laras Hijrah (hari):</span><button id="hm">−</button><b id="hoff">0</b><button id="hp">+</button></div>
    </div>
    <div class="hint" data-i18n="hint">Ketik jam untuk tukar 12/24 jam · Waktu Brunei (GMT+8)</div>
  </div>
</header>

<main>
  <section class="grid" id="grid"></section>
  <p class="empty" id="empty" data-i18n="none">Tiada sistem dijumpai.</p>
</main>

<div class="foot">
  <button class="btn ghost" id="installLink" style="display:none" data-i18n="installBtn">📲 Pasang Aplikasi</button>
  <span id="iosTip" style="display:none" data-i18n="ios"></span>
</div>

<div class="install" id="install" role="dialog">
  <img src="icons/icon-192.png" alt="">
  <div><strong data-i18n="installTitle">Pasang SYSHHB Portal</strong><br><span data-i18n="installText" style="color:var(--muted)">Akses pantas dari skrin utama.</span></div>
  <button class="btn" id="installGo" data-i18n="install">Pasang</button>
  <button class="btn ghost" id="installX" aria-label="Tutup">✕</button>
</div>

<script>
/* ===== TAMBAH / UBAH SISTEM DI SINI (add or edit systems here) ===== */
const SYSTEMS = [
  { icon:"🛠️", url:"https://helpdesk.syayasan.edu.bn/",
    ms:{name:"SYSHHB IT Helpdesk", desc:"Hantar dan jejak aduan serta permintaan sokongan IT."},
    en:{name:"SYSHHB IT Helpdesk", desc:"Submit and track IT complaints and support requests."} },
  { icon:"🧾", url:"https://pembelian.syayasan.edu.bn/",
    ms:{name:"SYSHHB IT Purchase Tracker", desc:"Jejak proses pembelian aset: 601, 602, T-607, Indent, DO dan Invois."},
    en:{name:"SYSHHB IT Purchase Tracker", desc:"Track asset purchases: 601, 602, T-607, Indent, DO and Invoice."} },
  { icon:"💻", url:"https://itinventory.syayasan.edu.bn/",
    ms:{name:"SYSHHB IT Asset Inventory", desc:"Senarai dan pengurusan inventori aset IT."},
    en:{name:"SYSHHB IT Asset Inventory", desc:"IT asset inventory list and management."} }
];
const HM = ["Muharram","Safar","Rabiulawal","Rabiulakhir","Jamadilawal","Jamadilakhir","Rejab","Syaaban","Ramadan","Syawal","Zulkaedah","Zulhijjah"];
const T = {
 ms:{title:"Sistem Portal SYSHHB",search:"Cari sistem…",none:"Tiada sistem dijumpai.",open:"Buka",greg:"Masihi",hijri:"Hijrah",calbtn:"📅 Kalendar Hijrah",adj:"Laras Hijrah (hari):",
   hint:"Ketik jam untuk tukar 12/24 jam · Waktu Brunei (GMT+8)",installBtn:"📲 Pasang Aplikasi",installTitle:"Pasang SYSHHB Portal",installText:"Akses pantas dari skrin utama.",install:"Pasang",
   ios:"iPhone/iPad: ketik Kongsi ⬆️ kemudian “Tambah ke Skrin Utama”.",other:"EN",loc:"ms-MY",pm:"PTG",am:"PG",
   days:["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"],dshort:["Ahd","Isn","Sel","Rab","Kha","Jum","Sab"],
   months:["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"],
   g:["Selamat pagi","Selamat tengah hari","Selamat petang","Selamat malam"]},
 en:{title:"SYSHHB Portal System",search:"Search systems…",none:"No systems found.",open:"Open",greg:"Gregorian",hijri:"Hijri",calbtn:"📅 Hijri Calendar",adj:"Hijri adjust (days):",
   hint:"Tap the clock to switch 12/24h · Brunei time (GMT+8)",installBtn:"📲 Install App",installTitle:"Install SYSHHB Portal",installText:"Quick access from your home screen.",install:"Install",
   ios:"iPhone/iPad: tap Share ⬆️ then “Add to Home Screen”.",other:"BM",loc:"en-GB",pm:"PM",am:"AM",
   days:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],dshort:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
   months:["January","February","March","April","May","June","July","August","September","October","November","December"],
   g:["Good morning","Good afternoon","Good evening","Good night"]}
};
const $ = s => document.querySelector(s);
const store = {get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let lang = store.get('lang','ms'), h24 = store.get('h24','1')==='1', hoff = parseInt(store.get('hoff','0'))||0;
let view = null; /* {y,m} shown in calendar */

/* ---- Brunei time ---- */
const TZ='Asia/Brunei';
const bnFmt = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'});
function bnNow(){const o={};bnFmt.formatToParts(new Date()).forEach(p=>o[p.type]=+p.value);return {y:o.year,m:o.month,d:o.day,h:o.hour,i:o.minute,s:o.second};}
const hFmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:TZ,day:'numeric',month:'numeric',year:'numeric'});
function hijri(y,m,d){const dt=new Date(Date.UTC(y,m-1,d+hoff,4));const o={};hFmt.formatToParts(dt).forEach(p=>o[p.type]=parseInt(p.value));return {d:o.day,m:o.month,y:o.year||o.relatedYear};}
const dow=(y,m,d)=>new Date(Date.UTC(y,m-1,d)).getUTCDay();

/* ---- clock ---- */
const dEls=[0,1,2,3,4,5].map(i=>$('#d'+i)); let last=['','','','','',''];
function setDigits(str){str.split('').forEach((c,i)=>{if(last[i]!==c){dEls[i].textContent=c;dEls[i].classList.remove('flip');void dEls[i].offsetWidth;dEls[i].classList.add('flip');last[i]=c;}});}
let lastSec=-1;
function updateClock(){
  const n=bnNow(),t=T[lang];
  if(n.s!==lastSec){
    lastSec=n.s;
    let h=n.h; if(!h24){h=h%12||12;}
    setDigits(String(h).padStart(2,'0')+String(n.i).padStart(2,'0')+String(n.s).padStart(2,'0'));
    $('#ampm').textContent=h24?'':(n.h>=12?t.pm:t.am);
    $('#ampm').style.display=h24?'none':'';
    $('#sun').textContent=n.h>=6&&n.h<18?(n.h>=17?'🌇':'☀️'):'🌙';
    const gi=n.h<5?3:n.h<12?0:n.h<15?1:n.h<19?2:3;
    $('#greet').textContent=t.g[gi]+' 👋';
    if(n.s===0||!$('#gdate').textContent) updateDates(n);
  }
  requestAnimationFrame(updateClock);
}
function updateDates(n){
  n=n||bnNow();const t=T[lang],hj=hijri(n.y,n.m,n.d);
  $('#gdate').textContent=t.days[dow(n.y,n.m,n.d)]+', '+n.d+' '+t.months[n.m-1]+' '+n.y;
  $('#hdate').textContent=hj.d+' '+HM[hj.m-1]+' '+hj.y+' H';
}
/* smooth seconds ring */
(function ring(){const ms=(Date.now()%60000)/60000;$('#fg').style.strokeDashoffset=276.46*(1-ms);requestAnimationFrame(ring);})();

/* ---- calendar ---- */
function drawCal(){
  const t=T[lang],n=bnNow(); if(!view) view={y:n.y,m:n.m};
  const first=dow(view.y,view.m,1),dim=new Date(Date.UTC(view.y,view.m,0)).getUTCDate();
  const h1=hijri(view.y,view.m,1),h2=hijri(view.y,view.m,dim);
  $('#calt').innerHTML=t.months[view.m-1]+' '+view.y+'<small>'+HM[h1.m-1]+' '+h1.y+(h1.m!==h2.m?' – '+HM[h2.m-1]+' '+h2.y:'')+' H</small>';
  let html=t.dshort.map((d,i)=>`<div class="w${i===5?' fri':''}">${d}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=dim;d++){
    const hj=hijri(view.y,view.m,d),dw=dow(view.y,view.m,d);
    const cls=['cd',dw===5?'fri':'',(view.y===n.y&&view.m===n.m&&d===n.d)?'today':'',hj.d===1?'h1st':''].join(' ');
    html+=`<div class="${cls}">${d}<i>${hj.d===1?HM[hj.m-1].slice(0,3)+' 1':hj.d}</i></div>`;
  }
  $('#cg').innerHTML=html; $('#hoff').textContent=(hoff>0?'+':'')+hoff;
}
$('#calbtn').onclick=()=>{$('#cal').classList.toggle('open');view=null;drawCal();};
$('#hbox').onclick=$('#gbox').onclick=()=>{$('#cal').classList.add('open');view=null;drawCal();};
$('#prev').onclick=()=>{view.m--;if(view.m<1){view.m=12;view.y--;}drawCal();};
$('#next').onclick=()=>{view.m++;if(view.m>12){view.m=1;view.y++;}drawCal();};
$('#hm').onclick=()=>{hoff--;store.set('hoff',hoff);updateDates();drawCal();};
$('#hp').onclick=()=>{hoff++;store.set('hoff',hoff);updateDates();drawCal();};
$('#timerow').onclick=()=>{h24=!h24;store.set('h24',h24?'1':'0');lastSec=-1;last=['','','','','',''];};

/* ---- cards ---- */
function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
  document.title=t.title;$('#lang').textContent=t.other;
  const list=SYSTEMS;
  $('#grid').innerHTML=list.map((s,i)=>`<a class="card" href="${s.url}" target="_blank" rel="noopener" style="animation-delay:${i*90}ms">
    <div class="ico" style="--d:${i*.4}s">${s.icon}</div><h2>${s[lang].name}</h2><p>${s[lang].desc}</p><span class="go">${t.open} <span>→</span></span></a>`).join('');
  $('#empty').style.display=list.length?'none':'block';
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      c.style.setProperty('--ry',((x-.5)*10)+'deg');c.style.setProperty('--rx',((.5-y)*10)+'deg');c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');});
    c.addEventListener('pointerleave',()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');});
    c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),s=document.createElement('span');s.className='rip';const z=Math.max(r.width,r.height)/4;
      s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;c.appendChild(s);setTimeout(()=>s.remove(),600);});
  });
  lastSec=-1;updateDates();if($('#cal').classList.contains('open'))drawCal();
}
$('#lang').onclick=()=>{lang=lang==='ms'?'en':'ms';store.set('lang',lang);render();};
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;store.set('theme',nx);};
const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th;

/* ---- logo: tilt follows pointer, click to spin ---- */
const logo=$('#logo');
addEventListener('pointermove',e=>{const r=$('#logoWrap').getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/innerWidth,dy=(e.clientY-(r.top+r.height/2))/innerHeight;
  if(!logo.classList.contains('spin'))logo.style.transform=`rotateY(${dx*40}deg) rotateX(${-dy*40}deg)`;});
$('#logoWrap').onclick=()=>{logo.style.transform='';logo.classList.add('spin');setTimeout(()=>logo.classList.remove('spin'),950);};

/* ---- floating sparkles in header ---- */
(function(){const cv=$('#fx'),cx=cv.getContext('2d');let W,H,P=[];
  function size(){W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;P=Array.from({length:Math.round(W/28)},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,v:.2+Math.random()*.6,a:Math.random()*6}));}
  size();addEventListener('resize',size);
  function f(){cx.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v;p.a+=.03;if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
    cx.beginPath();cx.fillStyle=`rgba(246,230,42,${.25+.25*Math.sin(p.a)})`;cx.arc(p.x+Math.sin(p.a)*8,p.y,p.r,0,7);cx.fill();});requestAnimationFrame(f);}
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)f();})();

/* ---- install app ---- */
let deferred=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#installLink').style.display='inline-block';
  let dis=null;try{dis=sessionStorage.getItem('dismissInstall')}catch(_){}if(!dis)$('#install').classList.add('show');});
async function doInstall(){if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#install').classList.remove('show');$('#installLink').style.display='none';}
$('#installGo').onclick=doInstall;$('#installLink').onclick=doInstall;
$('#installX').onclick=()=>{$('#install').classList.remove('show');try{sessionStorage.setItem('dismissInstall','1')}catch(_){}};
addEventListener('appinstalled',()=>$('#install').classList.remove('show'));
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone)$('#iosTip').style.display='inline';
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

render();updateClock();
</script>
</body>
</html>
